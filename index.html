<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scholarship Monitoring System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css"></head><body>
<div id="login"><div class="lbox"><div class="logo">🎓</div><h2>Scholarship Monitoring</h2><p>Academic Compliance System</p>
<input id="em" placeholder="Email"><input id="pw" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
<button onclick="login()">Sign in</button></div></div>
<div id="toast"></div>

<div id="app" class="hide">
<nav id="nav"></nav>
<main><h1 id="title"></h1>
<section id="dashboard"><div class="grid" id="stats"></div></section>

<section id="scholars" class="hide">
<div class="card"><h3>Scholar</h3><input type="hidden" id="s_id">
<input id="s_sid" placeholder="Student ID"><input id="s_name" placeholder="Full name">
<input id="s_deg" placeholder="Degree program"><select id="s_yr"><option value="">Year level</option><option value="1">1st Year</option><option value="2">2nd Year</option><option value="3">3rd Year</option><option value="4">4th Year</option></select>
<select id="s_prog"></select>
<select id="s_status"></select>
<button class="act" onclick="saveScholar()">Save</button></div>
<div class="card"><input id="q" placeholder="Search Student ID / name" oninput="loadScholars()">
<select id="f_prog" onchange="loadScholars()"></select><select id="f_status" onchange="loadScholars()"></select>
<table id="s_tbl"></table></div></section>

<section id="programs" class="hide">
<div class="card" id="p_card"><h3>Scholarship Program (Admin only)</h3>
<input id="p_name" placeholder="Program name"><input id="p_gwa" type="number" step="0.01" placeholder="Max GWA (1.0 best)">
<input id="p_units" type="number" placeholder="Min units"><label><input type="checkbox" id="p_fail">Allow failing</label>
<button class="act" onclick="saveProgram()">Add</button></div>
<div class="card"><table id="p_tbl"></table></div></section>

<section id="submissions" class="hide">
<div class="card"><h3>Grade Submission</h3><select id="g_sch"></select>
<input id="g_ay" placeholder="Academic year e.g. 2025-2026"><select id="g_sem"><option>1st</option><option>2nd</option><option>Summer</option></select>
<input id="g_gwa" type="number" step="0.01" placeholder="GWA (1.0–5.0)"><input id="g_units" type="number" placeholder="Units">
<input id="g_fail" type="number" placeholder="Failed" value="0"><input id="g_inc" type="number" placeholder="Incomplete" value="0">
<button class="act" onclick="submitGrades()">Submit</button></div>
<div class="card"><h3>Pending Verification</h3><table id="g_tbl"></table></div></section>

<section id="compliance" class="hide"><div class="card"><h3>Verified Evaluations</h3><table id="c_tbl"></table></div></section>
</main></div>

<script src="js/config.js"></script>
<script src="js/app.js"></script></body></html>
